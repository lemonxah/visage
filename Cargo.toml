[package]
name = "visage"
version = "26.8.0"
edition = "2021"
rust-version = "1.89"
description = "Linux eye, face and tongue tracking relay for VRChat and Resonite, forked from galister/oscavmgr"
license = "MIT"
repository = "https://github.com/lemonxah/visage"
readme = "README.md"
keywords = ["vr", "vrchat", "osc", "face-tracking", "openxr"]
categories = ["games"]

[dependencies]
env_logger = "0.11.6"
glam = { version = "=0.30.10", features = ["mint"] }
glob = "0.3.2"
log = "0.4.25"
once_cell = "1.20.0"
regex = "1.11.1"
reqwest = { version = "0.12.12", features = ["blocking", "charset"], default-features = false }
rosc = "0.10.1"
serde = { version = "1.0.217", features = ["derive", "rc"] }
serde_json = "1.0.138"
strum = { version = "0.27.0", features = ["derive"] }
alvr_events = { git = "https://github.com/alvr-org/ALVR.git", optional = true, tag = "v20.14.1" }
alvr_common = { git = "https://github.com/alvr-org/ALVR.git", optional = true, tag = "v20.14.1" }
sysinfo = { version = "0.33.0", optional = true }
anyhow = "1.0.95"
indicatif = "=0.18.6"
indicatif-log-bridge = "=0.2.3"
colored = "3.0.0"
openxr = { git = "https://github.com/Ralith/openxrs.git", rev = "d9bea09", default-features = false, features = ["linked", "mint"], optional = true }
mint = "0.5.9"
clap = { version = "4.5.28", features = ["derive"] }
websocket = { version = "0.27.1", default-features = false, features = ["sync"] }
hickory-proto = { version = "0.26.1", features = ["mdns"] }
socket2 = "0.6.5"
if-addrs = { version = "0.15.0", features = ["link-local"] }
mdns-sd = "0.20.3"
libc = { version = "0.2.189", optional = true }
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
serialport = { version = "4.10.1", optional = true, default-features = false }
zune-jpeg = { version = "0.5.15", optional = true }
v4l = { version = "0.14.0", optional = true }

[features]
default = ["alvr", "openxr", "babble"]
alvr = ["dep:alvr_events", "dep:alvr_common", "dep:sysinfo"]
openxr = ["dep:openxr"]
babble = []
qpro-tongue = ["openxr", "dep:ort", "dep:libc"]
gui = ["dep:eframe", "dep:libc"]
cameras = ["babble", "dep:ort", "dep:serialport", "dep:zune-jpeg", "dep:v4l"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
